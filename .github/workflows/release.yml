name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            args: "--bundles appimage,deb"
            rustTargets: ""
            signingIdentity: ""
          - name: Windows x64
            platform: windows-latest
            args: "--bundles nsis"
            rustTargets: ""
            signingIdentity: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin --bundles dmg"
            rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"
            signingIdentity: "-"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin --bundles dmg"
            rustTargets: "aarch64-apple-darwin,x86_64-apple-darwin"
            signingIdentity: "-"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out tag
        uses: actions/checkout@v7

      - name: Verify tag matches application version
        shell: bash
        run: |
          node -e "const tag = process.env.GITHUB_REF_NAME.replace(/^v/, ''); const version = require('./src-tauri/tauri.conf.json').version; if (tag !== version) { console.error('Tag v' + tag + ' does not match app version ' + version); process.exit(1); }"

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and attach release bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.signingIdentity }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Steam Storage Optimiser ${{ github.ref_name }}"
          releaseBody: "Download the bundle for your operating system from the assets below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
